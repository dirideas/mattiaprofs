<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord Aanpassen | VidiNini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div id="sidebar-container" data-include="sidebarwidget.html"></div>

    <nav class="nav-overview">
        <a href="index.html">VidiNini</a>
    </nav>

    <div class="main-content flex-center">
        <div class="login-card">
            <h2>Nieuw wachtwoord</h2>
            <p>Stel hieronder je nieuwe wachtwoord in.</p>
            
            <form action="login.html" onsubmit="return validatePasswords(event)">
                <div class="form-group">
                    <label for="new_password">Nieuw wachtwoord</label>
                    <div class="password-wrapper">
                        <input type="password" id="new_password" name="new_password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('new_password', this)">👁️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="repeat_password">Herhaal wachtwoord</label>
                    <div class="password-wrapper">
                        <input type="password" id="repeat_password" name="repeat_password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('repeat_password', this)">👁️</span>
                    </div>
                    <small id="password-error" style="color: red; display: none; margin-top: 5px; font-weight: bold;">Wachtwoorden komen niet overeen.</small>
                </div>
                
                <button type="submit" class="cta-button full-width">Wachtwoord opslaan</button>
            </form>

            <div class="login-links">
                <a href="login.html">Terug naar inloggen</a>
            </div>
        </div>
    </div>

    <div id="footer-container" data-include="footer.html"></div>
    
    <script src="includes.js"></script>
    <script>
        // Checkt of het nieuwe wachtwoord en de herhaling exact hetzelfde zijn ingevuld
        function validatePasswords(event) {
            const password = document.getElementById('new_password').value;
            const passwordRepeat = document.getElementById('repeat_password').value;
            const errorText = document.getElementById('password-error');

            if (password !== passwordRepeat) {
                event.preventDefault(); // Voorkomt dat het formulier verzonden wordt
                errorText.style.display = 'block'; // Toont de rode foutmelding
                return false;
            }
            
            errorText.style.display = 'none';
            return true;
        }

        // Wisselt tussen verborgen (bolletjes) en zichtbare tekst
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈'; 
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>

</body>
</html>
