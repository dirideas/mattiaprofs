<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | VidiNini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div id="sidebar-container" data-include="sidebarwidget.html"></div>

    <nav class="nav-overview">
        <a href="index.html">VidiNini</a>
    </nav>

    <div class="main-content flex-center">
        <div class="login-card">
            <h2>Welkom terug</h2>
            <p>Log in om je video's te beheren.</p>
            
            <form action="overview/index.html">
                <div class="form-group">
                    <label for="email">E-mailadres</label>
                    <input type="email" id="email" name="email" placeholder="naam@.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
                    </div>
                </div>
                
                <button type="submit" class="cta-button full-width">Inloggen</button>
            </form>

            <div class="login-links">
                <a href="accountcreate.html">Account aanmaken</a><br><br>
                <a href="recovery.html">Wachtwoord vergeten?</a>
            </div>
        </div>
    </div>

    <div id="footer-container" data-include="footer.html"></div>
    
    <script src="includes.js"></script>
    <script>
        // Dit scriptje verandert het type van de input van 'password' (verborgen) naar 'text' (zichtbaar) en past de smiley aan
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈'; 
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>

</body>
</html>
