<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | VidiNini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <nav class="nav-overview">
        <a href="index.html">VidiNini</a>
    </nav>

    <div class="main-content flex-center">
        <div class="login-card">
            <h2>Welkom terug</h2>
            <p>Log in om je video's te beheren.</p>
            
            <form id="login-form" onsubmit="return checkLogin(event)">
                <div class="form-group">
                    <label for="username">Loginnaam of E-mailadres</label>
                    <input type="text" id="username" name="username" placeholder="publisher@naam.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
                    </div>
                    <small id="login-error" style="display: none; color: red; margin-top: 5px; font-weight: bold;">Onjuiste inloggegevens.</small>
                </div>
                
                <button type="submit" class="cta-button full-width">Inloggen</button>
            </form>

            <div class="login-links">
                <a href="accountcreate.html">Account aanmaken</a><br><br>
                <a href="recovery.html">Wachtwoord vergeten?</a>
            </div>
        </div>
    </div>

    <div id="footer-container" data-include="footer.html"></div>
    
    <script src="includes.js"></script>
    <script>
        function checkLogin(event) {
            event.preventDefault(); // Voorkomt dat het formulier de pagina herlaadt

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorText = document.getElementById('login-error');

            // Verberg de foutmelding bij een nieuwe poging
            errorText.style.display = 'none';

            // Check de testgegevens
            if (usernameInput === 'testpublisher' && passwordInput === 'test') {
                window.location.href = 'overview.html';
            } else {
                // Toon de foutmelding als het niet klopt
                errorText.style.display = 'block';
            }
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈'; 
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>

</body>
</html>
